<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор рациона & КБЖУ</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4" x-data="mealPlanner()">

    <div class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Шапка -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">🍽️ Конструктор рациона на день</h1>
            <p class="text-slate-500">Соберите свое меню, контролируйте КБЖУ и баланс нутриентов</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Левая колонка: Выбор блюд -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Цель по калориям -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <span class="text-sm font-medium text-slate-400 uppercase tracking-wider">Дневная цель</span>
                        <div class="text-2xl font-bold text-slate-900" x-text="targetCalories + ' ккал'"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Изменить норму</label>
                        <input type="number" x-model.number="targetCalories" class="w-28 px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Список категорий / блюд -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Добавить блюда в рацион</h2>
                    
                    <div class="space-y-4">
                        <template x-for="item in availableFood" :key="item.id">
                            <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl hover:bg-slate-100 transition">
                                <div>
                                    <div class="font-medium text-slate-800" x-text="item.name"></div>
                                    <div class="text-xs text-slate-500 mt-0.5">
                                        <span x-text="item.cals + ' ккал'"></span> • 
                                        Б: <span x-text="item.p + 'г'"></span>, 
                                        Ж: <span x-text="item.f + 'г'"></span>, 
                                        У: <span x-text="item.c + 'г'"></span>
                                    </div>
                                </div>
                                <button @click="addMeal(item)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition shadow-sm shadow-indigo-100">
                                    + Добавить
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Ваш рацион и КБЖУ -->
            <div class="space-y-6">
                
                <!-- Итоги КБЖУ -->
                <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-indigo-800 rounded-full opacity-50 pointer-events-none"></div>
                    
                    <h2 class="text-lg font-semibold mb-4">Сводка за день</h2>
                    
                    <div class="mb-5">
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-indigo-200">Калории</span>
                            <span class="font-medium"><span x-text="totalCals"></span> / <span x-text="targetCalories"></span> ккал</span>
                        </div>
                        <div class="w-full bg-indigo-950 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-indigo-400 h-2.5 rounded-full transition-all duration-300" :style="'width: ' + Math.min(100, (totalCals / targetCalories) * 100) + '%'"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 pt-4 border-t border-indigo-800/60 text-center">
                        <div>
                            <div class="text-xs text-indigo-300 mb-1">Белки</div>
                            <div class="text-lg font-bold" x-text="totalP + 'г'"></div>
                        </div>
                        <div>
                            <div class="text-xs text-indigo-300 mb-1">Жиры</div>
                            <div class="text-lg font-bold" x-text="totalF + 'г'"></div>
                        </div>
                        <div>
                            <div class="text-xs text-indigo-300 mb-1">Углеводы</div>
                            <div class="text-lg font-bold" x-text="totalC + 'г'"></div>
                        </div>
                    </div>
                </div>

                <!-- Выбранные блюда -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Ваш рацион</h2>
                    
                    <template x-if="selectedMeals.length === 0">
                        <p class="text-sm text-slate-400 text-center py-6">Рацион пока пуст. Выберите блюда слева 👈</p>
                    </template>

                    <div class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <template x-for="(meal, index) in selectedMeals" :key="index">
                            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl text-sm">
                                <div>
                                    <div class="font-medium text-slate-800" x-text="meal.name"></div>
                                    <div class="text-xs text-slate-400" x-text="meal.cals + ' ккал'"></div>
                                </div>
                                <button @click="removeMeal(index)" class="text-slate-400 hover:text-rose-600 transition p-1">
                                    ✕
                                </button>
                            </div>
                        </template>
                    </div>

                    <template x-if="selectedMeals.length > 0">
                        <button @click="selectedMeals = []" class="w-full mt-5 py-2.5 text-sm font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition">
                            Очистить рацион
                        </button>
                    </template>
                </div>

            </div>

        </div>
    </div>

    <script>
        function mealPlanner() {
            return {
                targetCalories: 2000,
                availableFood: [
                    { id: 1, name: 'Овсяноблин с авокадо и яйцом', cals: 380, p: 14, f: 22, c: 32 },
                    { id: 2, name: 'Куриная грудка с гречкой', cals: 450, p: 42, f: 8, c: 50 },
                    { id: 3, name: 'Лосось на гриле с овощами', cals: 520, p: 36, f: 28, c: 12 },
                    { id: 4, name: 'Творожная запеканка с ягодным соусом', cals: 310, p: 24, f: 10, c: 28 },
                    { id: 5, name: 'Протеиновый смути-боул с бананом', cals: 290, p: 22, f: 5, c: 40 },
                    { id: 6, name: 'Салат Цезарь с индейкой', cals: 410, p: 32, f: 18, c: 24 }
                ],
                selectedMeals: [],
                
                addMeal(item) {
                    this.selectedMeals.push({...item});
                },
                
                removeMeal(index) {
                    this.selectedMeals.splice(index, 1);
                },

                get totalCals() {
                    return this.selectedMeals.reduce((sum, item) => sum + item.cals, 0);
                },
                get totalP() {
                    return this.selectedMeals.reduce((sum, item) => sum + item.p, 0);
                },
                get totalF() {
                    return this.selectedMeals.reduce((sum, item) => sum + item.f, 0);
                },
                get totalC() {
                    return this.selectedMeals.reduce((sum, item) => sum + item.c, 0);
                }
            }
        }
    </script>
</body>
</html>
